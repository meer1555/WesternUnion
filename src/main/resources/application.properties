# =========================================
# Western Union Bank - Application Config
# =========================================

server.port=8080
spring.application.name=westernunion-bank

# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/westernunion_bank?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
app.jwt.secret=ChangeThisSecretKeyToSomethingVeryLongAndRandomForWesternUnionBank2026!!
app.jwt.expiration-ms=86400000

# ---- Bank Config ----
app.bank.name=Western Union Bank
app.bank.account-number-prefix=WU

# ---- Logging ----
logging.level.org.springframework.security=INFO
logging.level.com.westernunion.bank=DEBUG
