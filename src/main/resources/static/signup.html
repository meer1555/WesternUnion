<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Open an Account — Western Union Bank</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page-loader"><div class="loader-mark">WU</div></div>
<div class="bg-scene"></div>

<div class="auth-wrap">
  <div class="auth-visual">
    <video autoplay muted loop playsinline
           poster="https://images.unsplash.com/photo-1481487196290-c152efe083f5?q=80&w=1600&auto=format&fit=crop">
      <source src="videos/auth-banking.mp4" type="video/mp4" />
    </video>
    <div class="veil"></div>
    <div class="quote">
      <p>“Opening my Western Union Bank account took two minutes — and I had my account number instantly.”</p>
      <span>— New member experience</span>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card glass">
      <div class="logo-row">
        <span class="mark">WU</span>
        <strong>Western Union Bank</strong>
      </div>
      <h2>Create your account</h2>
      <p class="sub">Join in seconds — get a bank account number the moment you sign up.</p>

      <div class="alert alert-error" id="error-box"></div>

      <form id="signup-form" autocomplete="off">
        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Jane Appleseed" required />
        </div>
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="+1 555 123 4567" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          <span class="spinner"></span>
          <span class="btn-label">Create My Account</span>
        </button>
      </form>

      <div class="form-footer">Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  Auth.redirectIfLoggedIn();

  const form = document.getElementById('signup-form');
  const errorBox = document.getElementById('error-box');
  const submitBtn = document.getElementById('submit-btn');

  function setLoading(loading) {
    submitBtn.classList.toggle('loading', loading);
    submitBtn.disabled = loading;
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    setLoading(true);

    const payload = {
      fullName: document.getElementById('fullName').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      password: document.getElementById('password').value
    };

    try {
      const data = await api('/auth/signup', { method: 'POST', body: JSON.stringify(payload) });
      Auth.setSession(data);
      showToast(`Welcome, ${data.fullName.split(' ')[0]}! Your account number is ${data.accountNumber}`, 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 900);
    } catch (err) {
      showError(err.message);
      setLoading(false);
    }
  });
</script>
</body>
</html>
