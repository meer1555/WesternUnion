services:
  mysql:
    image: mysql:8.4
    container_name: wu-bank-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: westernunion_bank
    volumes:
      - wu_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host on purpose — only the app container can reach it.
    # Uncomment the next two lines only if you need to connect from outside the box (e.g. a GUI client).
    # ports:
    #   - "3306:3306"

  app:
    build: .
    container_name: wu-bank-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/westernunion_bank?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    ports:
      - "8080:8080"

volumes:
  wu_mysql_data:
