<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — Western Union Bank</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page-loader"><div class="loader-mark">WU</div></div>
<div class="bg-scene"></div>

<div class="auth-wrap">
  <div class="auth-visual">
    <video autoplay muted loop playsinline
           poster="https://images.unsplash.com/photo-1614028674026-a65e31bfd27c?q=80&w=1600&auto=format&fit=crop">
      <source src="videos/auth-banking.mp4" type="video/mp4" />
    </video>
    <div class="veil"></div>
    <div class="quote">
      <p>“Fast, secure, and genuinely premium-feeling — banking the way it should be.”</p>
      <span>— Member since 2026</span>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card glass">
      <div class="logo-row">
        <span class="mark">WU</span>
        <strong>Western Union Bank</strong>
      </div>
      <h2>Welcome back</h2>
      <p class="sub">Log in to view your balance and manage transfers.</p>

      <div class="alert alert-error" id="error-box"></div>

      <form id="login-form" autocomplete="off">
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          <span class="spinner"></span>
          <span class="btn-label">Log In</span>
        </button>
      </form>

      <div class="form-footer">New to Western Union Bank? <a href="signup.html">Open an account</a></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  Auth.redirectIfLoggedIn();

  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error-box');
  const submitBtn = document.getElementById('submit-btn');

  function setLoading(loading) {
    submitBtn.classList.toggle('loading', loading);
    submitBtn.disabled = loading;
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    setLoading(true);

    const payload = {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    };

    try {
      const data = await api('/auth/login', { method: 'POST', body: JSON.stringify(payload) });
      Auth.setSession(data);
      showToast(`Welcome back, ${data.fullName.split(' ')[0]}!`, 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 700);
    } catch (err) {
      showError(err.message);
      setLoading(false);
    }
  });
</script>
</body>
</html>
